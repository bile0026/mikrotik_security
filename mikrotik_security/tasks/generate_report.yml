---
# tasks for writing and sending reports

- name: Validate requested report formats
  ansible.builtin.assert:
    that: routeros_report_formats | difference(routeros_report_templates.keys() | list) | length == 0
    fail_msg: >-
      routeros_report_formats may only contain
      {{ routeros_report_templates.keys() | join(', ') }}
    quiet: true
  run_once: true

- name: Generate reports
  template:
    src: "templates/{{ routeros_report_templates[item] }}"
    dest: "{{ routeros_report_files[item] }}"
  loop: "{{ routeros_report_formats }}"
  vars:
    report_date: "{{ lookup('pipe','date +%Y-%m-%d') }}"
  delegate_to: localhost
  run_once: true

- name: Email report
  mail:
    from: "{{ from_email }}"
    to: "{{ email_addresses }}"
    port: "{{ smtp_port }}"
    subject: MikroTik Security report for {{ location }} {{ lookup('pipe','date +%Y-%m-%d') }}
    subtype: "{{ 'html' if 'html' in routeros_report_formats else 'plain' }}"
    body: "{{ lookup('file', routeros_report_files['html']) if 'html' in routeros_report_formats else omit }}"
    host: "{{ smtp_server }}"
    attach: "{{ routeros_report_formats | map('extract', routeros_report_files) | list }}"
  delegate_to: localhost
  run_once: true
  when:
    - smtp_server is defined

- name: Slack Report
  community.general.slack:
    token: "{{ slack_token }}"
    channel: "#{{ slack_channel }}"
    username: "{{ slack_username }}"
    blocks:
      - type: section
        text:
          type: mrkdwn
          text: |-
            MikroTik Security Report *{{ location }}* {{ lookup('pipe','date +%Y-%m-%d') }}

            ```{{ slack_summary | truncate(2800) }}```
  vars:
    slack_summary: "{{ lookup('template', 'slack_report.j2') | trim }}"
  delegate_to: localhost
  run_once: true
  when:
    - slack_token is defined
